name: Tests

# The JS suite and the Kotlin call tests both already exist but ran nowhere in
# CI, so a regression in AudioRouter / VendorAudioPolicy / the WebRTC gate only
# surfaced once it reached users. Both jobs are cheap: the Android job needs no
# emulator, no web bundle and no secrets: `npm ci`, `cap sync` against a stub
# web dir (for the gitignored cordova plugins project) and the JVM unit tests.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Types + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # auto-imports.d.ts / components.d.ts are gitignored build outputs;
      # without them vue-tsc cannot see ref/watch/provide in a fresh checkout.
      - name: Generate type declarations
        run: node scripts/generate-type-declarations.mjs

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: npm run test

  android-unit:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The Capacitor Gradle modules resolve to node_modules/@capacitor/*, so
      # the JS dependencies are required even though nothing here builds web.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # capacitor-cordova-android-plugins/ (cordova.variables.gradle) is
      # generated by `cap sync` and gitignored. Sync needs a web dir; a stub
      # page is enough — the unit tests do not load web assets.
      - name: Generate Capacitor Android project files
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>ci</title>' > dist/index.html
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # llama-cpp-pro pins an NDK (android/build.gradle ndkVersion) that Gradle
      # downloads on first configure; the runner's SDK does not have its
      # licence accepted, so configuration fails without this (same step as
      # android-test-apk.yml).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testSideloadDebugUnitTest --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/
          retention-days: 7
