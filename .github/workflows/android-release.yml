name: Android Release (manual)

# Android-only emergency / ad-hoc build. Tag releases use `.github/workflows/release.yml`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-manual
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npx vite build
        env:
          VITE_BUG_REPORT_TOKEN: ${{ secrets.VITE_BUG_REPORT_TOKEN }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/release-keystore.jks

      - name: Extract version from package.json
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -r major minor patch <<< "$VERSION"
          VERSION_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Inject version into build.gradle
        run: |
          sed -i 's/versionCode .*/versionCode ${{ steps.version.outputs.VERSION_CODE }}/' android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "${{ steps.version.outputs.VERSION }}"/' android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build sideload APK and Play AAB
        working-directory: android
        run: ./gradlew assembleSideloadRelease bundlePlayRelease
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify distribution manifests
        run: node scripts/verify-android-distribution.mjs

      - name: Rename APK and AAB
        run: |
          APK_DIR="android/app/build/outputs/apk/sideload/release"
          AAB_DIR="android/app/build/outputs/bundle/playRelease"
          if [ ! -f "$APK_DIR/app-sideload-release.apk" ]; then
            echo "ERROR: signed sideload APK missing — check RELEASE_* signing secrets" >&2
            ls -la "$APK_DIR" || true
            exit 1
          fi
          mv "$APK_DIR/app-sideload-release.apk" \
             "$APK_DIR/forta-chat-${{ steps.version.outputs.VERSION }}.apk"
          mv "$AAB_DIR/app-play-release.aab" \
             "$AAB_DIR/forta-chat-${{ steps.version.outputs.VERSION }}.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-manual-${{ steps.version.outputs.VERSION }}-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/sideload/release/forta-chat-*.apk
            android/app/build/outputs/bundle/playRelease/forta-chat-*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/app/google-services.json
