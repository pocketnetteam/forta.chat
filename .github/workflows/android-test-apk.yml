name: Android Test APK

on:
  workflow_dispatch:

concurrency:
  group: android-test-apk
  cancel-in-progress: true

jobs:
  build-and-deploy-test-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npx vite build
        env:
          VITE_BUG_REPORT_TOKEN: ${{ secrets.VITE_BUG_REPORT_TOKEN }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/release-keystore.jks

      - name: Resolve next version
        id: version
        run: node scripts/resolve-next-test-apk-version.mjs

      - name: Inject test version into build.gradle
        run: node scripts/inject-android-test-version.mjs --version "${{ steps.version.outputs.version }}"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build sideload APK and Play AAB
        working-directory: android
        run: ./gradlew assembleSideloadRelease bundlePlayRelease
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify distribution manifests
        run: node scripts/verify-android-distribution.mjs

      - name: Prepare test APK and AAB for deploy
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_DIR="android/app/build/outputs/apk/sideload/release"
          AAB_DIR="android/app/build/outputs/bundle/playRelease"
          if [ -f "$APK_DIR/app-sideload-release.apk" ]; then
            SRC_APK="$APK_DIR/app-sideload-release.apk"
          elif [ -f "$APK_DIR/app-sideload-release-unsigned.apk" ]; then
            echo "ERROR: sideload APK is unsigned — check RELEASE_* signing secrets" >&2
            exit 1
          else
            echo "ERROR: sideload release APK not found in $APK_DIR" >&2
            ls -la "$APK_DIR" || true
            exit 1
          fi
          mv "$SRC_APK" "$APK_DIR/forta-chat-test-${VERSION}.apk"
          mv "$AAB_DIR/app-play-release.aab" "$AAB_DIR/forta-chat-test-${VERSION}.aab"
          mkdir -p apktests
          cp "$APK_DIR/forta-chat-test-${VERSION}.apk" apktests/latest.apk
          cp "$AAB_DIR/forta-chat-test-${VERSION}.aab" apktests/latest.aab
          printf '{"versionName":"%s","versionCode":%s,"commit":"%s","apk":"latest.apk","aab":"latest.aab","apkFlavor":"sideload","aabFlavor":"play"}\n' \
            "$VERSION" "$VERSION_CODE" "$SHORT_SHA" > apktests/version.json

      - name: Deploy test APK and AAB to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apktests/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}/apktests/
          dangerous-clean-slate: false

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/app/google-services.json
