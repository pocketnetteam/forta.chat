<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <title>Forta Chat</title>
    <meta name="description" content="Forta Chat — Decentralized Messenger" />
    <link rel="icon" type="image/png" href="/forta-icon.png" />
    <!--
      viewport-fit=cover is required for env(safe-area-inset-*) to resolve
      to non-zero values inside WKWebView on iOS. Without it the page would
      render inside the safe area instead of edge-to-edge and the notch /
      home-indicator math elsewhere in the app would collapse to 0.
      See docs/plans/ios/2026-05-12-ios-keyboard-safe-area.md Task 4.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafafa" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!--
      Session 10 fix: inline initial safe-area CSS vars before any bundle.
      On Android 15/16 edge-to-edge the WebView's first paint happens before
      native code injects real insets. Inline env() fallbacks prevent the
      flash of content rendering underneath the status bar.
      Native code (MainActivity.injectAllCssVars) overwrites these with
      exact device values as soon as insets become available.
    -->
    <style id="initial-safe-area">
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 24px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
        --keyboardheight: 0px;
        --app-bottom-inset: env(safe-area-inset-bottom, 0px);
      }
    </style>

    <!-- Open Graph -->
    <meta property="og:title" content="Forta Chat" />
    <meta property="og:description" content="Forta Chat — Decentralized Messenger" />
    <meta property="og:image" content="https://forta.chat/og-image.jpg" />
    <meta property="og:url" content="https://forta.chat" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Forta Chat" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Forta Chat" />
    <meta name="twitter:description" content="Forta Chat — Decentralized Messenger" />
    <meta name="twitter:image" content="https://forta.chat/og-image.jpg" />
  </head>
  <body>
    <div id="app">
      <div id="appLoading"></div>
    </div>
    <!--
      Boot guard (audit W2B-01). A classic script runs before every ES module, so
      it is the only place that can prepare old Android System WebView builds for
      the bundle. matrix-js-sdk-bastyon touches `globalThis` at module top level;
      WebView < 71 has no `globalThis`, so the whole module graph used to die
      before Vue existed and the user got a blank white screen with no way out.
      If the module graph still fails, or the WebView cannot run modules at all,
      the guard replaces the blank page with an "update Android System WebView"
      message. It is ES5 on purpose and cannot use i18n (it runs before the app).
      src/main.ts sets window.__fortaBootStarted once the module graph evaluated.
    -->
    <script id="boot-guard">
      (function (w, d, n) {
        if (typeof w.globalThis === "undefined") {
          w.globalThis = w;
        }

        var FALLBACK_DELAY_MS = 4000;
        var scheduled = false;

        function isOwnScript(filename) {
          var origin = w.location && w.location.origin;
          return !!filename && !!origin && origin !== "null" && filename.indexOf(origin) === 0;
        }

        function showUnsupported(detail) {
          if (w.__fortaBootStarted) return;
          var root = d.getElementById("app");
          if (!root) return;
          var ru = String((n && n.language) || "").toLowerCase().indexOf("ru") === 0;
          var box = d.createElement("div");
          box.setAttribute("data-boot-fallback", "true");
          box.style.cssText = "font-family:sans-serif;max-width:420px;margin:15vh auto 0;padding:0 20px;color:#1b1f24;text-align:center;line-height:1.45";
          var title = d.createElement("h1");
          title.style.cssText = "font-size:20px;margin:0 0 12px";
          title.textContent = ru ? "Forta Chat не может запуститься" : "Forta Chat cannot start";
          var text = d.createElement("p");
          text.style.cssText = "font-size:15px;margin:0 0 20px";
          text.textContent = ru
            ? "Системный компонент «Android System WebView» на этом устройстве устарел. Обновите «Android System WebView» и Google Chrome в Google Play, затем откройте приложение снова."
            : "The Android System WebView on this device is out of date. Update \"Android System WebView\" and Google Chrome in Google Play, then open the app again.";
          var button = d.createElement("button");
          button.type = "button";
          button.style.cssText = "font-size:15px;padding:10px 22px;border:0;border-radius:8px;background:#1f6f78;color:#fff";
          button.textContent = ru ? "Попробовать снова" : "Try again";
          button.onclick = function () { w.location.reload(); };
          var info = d.createElement("p");
          info.style.cssText = "font-size:12px;color:#6a737d;margin:24px 0 0;word-break:break-word";
          info.textContent = detail ? String(detail) : "";
          box.appendChild(title);
          box.appendChild(text);
          box.appendChild(button);
          box.appendChild(info);
          root.innerHTML = "";
          root.appendChild(box);
        }

        w.__fortaShowUnsupported = showUnsupported;

        w.addEventListener("error", function (event) {
          if (w.__fortaBootStarted || scheduled) return;
          if (!isOwnScript(event && event.filename)) return;
          scheduled = true;
          var detail = (event && event.message) || "";
          w.setTimeout(function () { showUnsupported(detail); }, FALLBACK_DELAY_MS);
        });
      })(window, document, navigator);
    </script>
    <script nomodule>
      window.__fortaShowUnsupported && window.__fortaShowUnsupported("ES modules are not supported");
    </script>
    <!-- Built-ins missing from old WebView builds (audit W2B-02); before the module entry. -->
    <script src="./legacy-polyfills.js"></script>
    <!--
      BUG-03: Prevent Android WebView from flipping text direction to RTL.
      Must run before any framework code — inline script, not module.
    -->
    <script>
      (function() {
        var html = document.documentElement;
        // Force LTR immediately
        html.setAttribute('dir', 'ltr');

        // Watch for any runtime injection of dir="rtl" by WebView or plugins
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            if (mutations[i].attributeName === 'dir' && html.getAttribute('dir') !== 'ltr') {
              html.setAttribute('dir', 'ltr');
            }
          }
        });
        observer.observe(html, { attributes: true, attributeFilter: ['dir'] });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
